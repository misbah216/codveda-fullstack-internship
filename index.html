<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🛒 Product Manager</h1>
  

  <form id="productForm">
    <input type="text" id="name" placeholder="Product name" required>
    <input type="number" id="price" placeholder="Price" required>
    <button type="submit">Add</button>
  </form>

  <input type="text" id="searchBox" placeholder="🔍 Search products..." class="search-box">

  <ul id="productList">
    <li class="empty-state" id="loadingState">Loading products...</li>
  </ul>
</div>

<div id="editModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>Edit Product</h2>
    <input type="text" id="editName" placeholder="Product name">
    <input type="number" id="editPrice" placeholder="Price">
    <div class="modal-actions">
      <button id="cancelEdit" class="cancel-btn">Cancel</button>
      <button id="saveEdit" class="save-btn">Save Changes</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
